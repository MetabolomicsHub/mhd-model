[project]
name = "mhd-model"
version = "1.0.17"
description = "MetabolomicsHub Common Data Model"
authors = [
  {name = "MetabolomicsHub Team", email = "help@metabolomicshub.org"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bioregistry>=0.15.0",
    "cachetools>=7.2.6",
    "charset-normalizer>=3.5.2",
    "email-validator>=2.3.0",
    "httpx2>=2.16.0",
    "jsonpath-ng>=1.14.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "reachable>=0.9.1",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "jsonprofile>=0.2.2",
    "ontology-lookup>=0.2.1",
]
[project.urls]
Repository = "https://github.com/MetabolomicsHub/mhd-model"
Documentation = "https://metabolomicshub.github.io/mhd-model"

[dependency-groups]
dev = [
    "pylint>=4.1.1",
    "importchecker>=3.0",
    "findimports>=3.0.0",
    "commitizen>=4.13.9",
    "import-linter>=2.11",
    "mkdocs-material>=9.7.7",
    "pre-commit>=4.5.1",
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "pymdown-extensions>=11.0.1",
    "setuptools>=83.0.0"
]

[tool.uv]
default-groups = []

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mhd_model*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"mhd_model" = ["**/*.json", "**/*.csv", "**/*.tsv", "**/*.txt"]

[tool.setuptools]
include-package-data = true


[project.optional-dependencies]
neo4j = [
    "neo4j>=5.28.2",
]

[project.scripts]
mhd-cli = "mhd_model.commands.cli:cli"


[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version = "1.0.17"
tag_format = "v$major.$minor.$patch"
version_files = [
    "pyproject.toml:version",
    "mhd_model/__init__.py:__version__",
    "docs/index.md",
]
bump_message = "bump: version $current_version -> $new_version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
addopts = "-ra -q -v"
testpaths = [
    "tests"
]

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "I", "G", "SLF", "PTH", "Q", "T"]
ignore = [ "BLE001", "RUF012", "TRY004", "TRY201", "TRY203", "TRY401" ]
fixable = ["ALL"]


[tool.importlinter]
include_external_packages = true
root_packages = ["mhd_model"]


[[tool.importlinter.contracts]]
name = "MHD Common Model File Layer Dependencies"
type = "layers"
layers = [
    "mhd_model.model.v1_0.dataset.profiles.ms",
    "mhd_model.model.v1_0.dataset.profiles.legacy",
    "mhd_model.model.v1_0.dataset.profiles.base",
    "mhd_model.shared",
]
